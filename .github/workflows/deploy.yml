name: Build & Deploy

on:
  push:
    branches: ['**']
  create:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VITE_ENV_PRODUCTION: ${{ secrets.VITE_ENV_PRODUCTION }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Crear env de producción
        run: printf '%s' "$VITE_ENV_PRODUCTION" > .env.production

      - name: Verificar env de producción
        run: |
          if [ ! -s .env.production ]; then
            echo "::error::El secret VITE_ENV_PRODUCTION esta vacio. Pega el contenido completo de tu .env.production en Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Deploy FTP
        if: env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          protocol: ftp